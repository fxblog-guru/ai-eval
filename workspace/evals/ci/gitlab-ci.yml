# Eval CI for a PROJECT that installs this bundle. Include it from your .gitlab-ci.yml:
#   include: { local: .evals/ci/gitlab-ci.yml }
#
# The cadence matters. A full eval on every merge request is either expensive, slow, or too small
# to be significant -- pick at most two. So: cheap deterministic checks on every MR, the full
# judged sweep nightly against a versioned dataset, adversarial and load runs manual.
image: python:3.12-slim

stages: [contract, task, adversarial]

variables:
  EVAL_ROOT: .evals

.python: &python
  before_script:
    - pip install -q -r .evals/requirements.txt || true

# Every MR. No model calls, no tokens, under a minute.
eval:contracts:
  <<: *python
  stage: contract
  script:
    - python3 $EVAL_ROOT/scripts/shared/lint_evals.py --root $EVAL_ROOT
    - python3 $EVAL_ROOT/scripts/shared/runner.py --suite contract --root $EVAL_ROOT --env dev
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Nightly. The full judged suite against the pinned dataset version.
eval:task:
  <<: *python
  stage: task
  script:
    - python3 $EVAL_ROOT/scripts/shared/runner.py --suite task --root $EVAL_ROOT --env staging
    - verdict upload --project "$VERDICT_PROJECT" --type eval --env staging --tag task
      $EVAL_ROOT/runs/task/*/ctrf.json --evidence $EVAL_ROOT/runs/task/*
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: false

# Manual only. CI never authorizes an environment for adversarial testing -- a human does,
# per EVAL-PROFILE section Environments, and only for systems the organization owns.
eval:redteam:
  <<: *python
  stage: adversarial
  script:
    - python3 $EVAL_ROOT/scripts/shared/runner.py --suite safety --root $EVAL_ROOT --env staging
  when: manual
  allow_failure: false
